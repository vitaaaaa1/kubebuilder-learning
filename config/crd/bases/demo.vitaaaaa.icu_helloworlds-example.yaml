              # 来源：Config AppConfig `json:"config"`
              # AppConfig 是 type AppConfig struct
              # 生成时变成 type: object，properties 是 AppConfig 的字段
              config:
                # description 来自字段注释
                description: Config is the application configuration
                properties:
                  # 来源：Enabled *bool `json:"enabled,omitempty"`
                  # optional 因为有 omitempty
                  enabled:
                    description: Enabled indicates if the application is enabled
                    type: boolean
                  # ====== Map 类型 (键值对) ======
                  # 来源：Env map[string]string `json:"env,omitempty"`
                  # 在 OpenAPI v3 中，map 用 type: object + additionalProperties 表示
                  env:
                    # additionalProperties 定义 map 中值的类型
                    # 这里是 string，因为 Go 代码是 map[string]string
                    # 如果是 map[string]int，这里就是 type: integer
                    additionalProperties:
                      type: string
                    description: Env holds key-value pairs of environment variables
                    type: object
                  # 来源：Port int `json:"port"`
                  # required 因为没有 omitempty
                  # maximum/minimum 来自 // +kubebuilder:validation:Maximum=65535 等注释
                  port:
                    description: Port is the port the application listens on
                    maximum: 65535
                    minimum: 1
                    type: integer
                # required: Port 是必填的，Enabled 不是
                required:
                - port
                type: object

              foo:
                description: foo is an example field of HelloWorld. Edit helloworld_types.go
                  to remove/update
                type: string

              # ====== 对象数组 (List of Objects) ======
              # 来源：Users []User `json:"users,omitempty"`
              # 生成时变成 type: array，items 定义数组里每个对象的结构
              users:
                description: Users is the list of users
                # items 定义数组元素的 schema
                # 来自 type User struct
                items:
                  description: User defines a user in the system
                  properties:
                    # 来源：Name string `json:"name"`
                    # required 因为没有 omitempty
                    name:
                      description: Name is the username
                      type: string
                    # 来源：Role string `json:"role"`
                    # enum 来自 // +kubebuilder:validation:Enum=admin;editor;viewer
                    role:
                      description: Role is the user role
                      enum:
                      - admin
                      - editor
                      - viewer
                      type: string
                  required:
                  - name
                  - role
                  type: object
                type: array
                # ====== List 的合并策略 (智能合并) ======
                # 来源：
                # // +listType=map
                # // +listMapKey=name
                # Users []User `json:"users,omitempty"`
                #
                # 作用：告诉 Kubernetes API Server 这是一个“关联列表”（Associative List）。
                # 当使用 kubectl apply 等命令进行更新时，API Server 会根据 name 字段
