# CustomResourceDefinition (CRD) 详细注释 - 与 Go 代码注释的映射关系
#
# 此文件展示 api/v1alpha1/helloworld_types.go 中的 +kubebuilder 注释
# 是如何被 controller-gen 转换成 CRD YAML 的每一个字段的。
---
# apiVersion: CRD 自身的 API 版本（固定值）
apiVersion: apiextensions.k8s.io/v1

# kind: CRD 的资源类型（固定值）
kind: CustomResourceDefinition

metadata:
  # annotations: controller-gen 自动添加的版本信息
  annotations:
    controller-gen.kubebuilder.io/version: v0.22.0

  # name: CRD 的全局唯一名称
  # 来源：{plural}.{group}.{domain}
  name: helloworlds.demo.vitaaaaa.icu

spec:
  # group: API group
  # 来源：api/v1alpha1/groupversion_info.go 中的 GroupName 定义
  group: demo.vitaaaaa.icu

  # names: CRD 的各种名称
  names:
    # categories: 资源分类
    # 来源：// +kubebuilder:resource:categories=all
    # 效果：kubectl get all 时会显示此资源
    categories:
    - all

    # kind: 资源类型名（用户创建 CR 时使用的 kind）
    # 来源：type HelloWorld struct
    kind: HelloWorld

    # listKind: 列表资源类型名
    # 来源：type HelloWorldList struct
    listKind: HelloWorldList

    # plural: 复数形式，用于 API 路径
    # 来源：HelloWorld → helloworlds（自动生成）
    plural: helloworlds

    # shortNames: 短名称列表
    # 来源：// +kubebuilder:resource:shortName=hw
    # 效果：kubectl get hw 代替 kubectl get helloworlds
    shortNames:
    - hw

    # singular: 单数形式
    # 来源：HelloWorld → helloworld（自动生成）
    singular: helloworld

  # scope: 资源作用域
  # Namespaced = 属于某个命名空间
  # Cluster = 集群级别
  # 来源：默认 Namespaced，可通过 // +kubebuilder:resource:scope=Cluster 修改
  scope: Namespaced

  # versions: CRD 支持的版本列表
  versions:
  - name: v1alpha1
    # name: 版本号
    # 来源：包名 api/v1alpha1

    # additionalPrinterColumns: kubectl get 时显示的额外列
    # 来源：HelloWorld 结构体上方的 // +kubebuilder:printcolumn: 注释
    additionalPrinterColumns:
    # 来源：// +kubebuilder:printcolumn:name="Message",type=string,JSONPath=.spec.message01
    - jsonPath: .spec.message01
      name: Message
      type: string

    # 来源：// +kubebuilder:printcolumn:name="Status",type=string,JSONPath=.status.conditions[?(@.type=='Available')].status
    - jsonPath: .status.conditions[?(@.type=='Available')].status
      name: Status
      type: string

    # 来源：// +kubebuilder:printcolumn:name="Age",type=date,JSONPath=.metadata.creationTimestamp
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date

    # 来源：// +kubebuilder:printcolumn:name="Foo",type=string,JSONPath=.spec.foo,priority=1
    # priority: 1 表示默认隐藏，需 kubectl get -o wide 才显示
    - jsonPath: .spec.foo
      name: Foo
      priority: 1
      type: string

    schema:
      openAPIV3Schema:
        # description: CRD 描述
        # 来源：// HelloWorld is the Schema for the helloworlds API
        description: HelloWorld is the Schema for the helloworlds API

        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string

          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string

          metadata:
            type: object

          spec:
            # description: spec 描述
            # 来源：// spec defines the desired state of HelloWorld
            description: spec defines the desired state of HelloWorld

            properties:
              foo:
                # description: 字段描述
                # 来源：// foo is an example field of HelloWorld. Edit helloworld_types.go to remove/update
                description: foo is an example field of HelloWorld. Edit helloworld_types.go
                  to remove/update
                # type: string 因为 Go 类型是 *string
                # optional 因为有 json:"foo,omitempty"
                type: string

              message01:
                # 以下三个验证规则来源：
                # // +kubebuilder:validation:MinLength=1
                # // +kubebuilder:validation:MaxLength=20
                # // +kubebuilder:validation:Pattern="^[a-z0-9]+$"
                maxLength: 20
                minLength: 1
                pattern: ^[a-z0-9]+$
                type: string

              message02:
                # 以下三个验证规则来源：
                # // +kubebuilder:validation:Minimum=1
                # // +kubebuilder:validation:Maximum=100
                # // +kubebuilder:validation:MultipleOf=5
                maximum: 100
                minimum: 1
                multipleOf: 5
                type: integer

            # required: 必填字段列表
            # 来源：Go 结构体中没有 omitempty 的指针字段
            # Message01 *string `json:"message01"` → 没有 omitempty → required
            # Message02 *int `json:"message02"` → 没有 omitempty → required
            # Foo *string `json:"foo,omitempty"` → 有 omitempty → NOT required
            required:
            - message01
            - message02

            type: object

          status:
            # description: status 描述
            # 来源：// status defines the observed state of HelloWorld
            description: status defines the observed state of HelloWorld

            properties:
              conditions:
                # description: conditions 描述
                # 来源：HelloWorldStatus.Conditions 字段上方的注释
                description: |-
                  conditions represent the current state of the HelloWorld resource.
                  Each condition has a unique type and reflects the status of a specific aspect of the resource.

                  Standard condition types include:
                  - "Available": the resource is fully functional
                  - "Progressing": the resource is being created or updated
                  - "Degraded": the resource failed to reach or maintain its desired state

                  The status of each condition is one of True, False, or Unknown.

                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string

                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string

                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer

                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string

                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string

                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string

                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type

                  type: object

                type: array

                # x-kubernetes-list-map-keys: 数组去重的键
                # 来源：// +listMapKey=type
                x-kubernetes-list-map-keys:
                - type

                # x-kubernetes-list-type: 数组类型
                # 来源：// +listType=map
                x-kubernetes-list-type: map

            type: object

        # required: CR 的顶层必填字段
        # spec 是 required 因为 HelloWorld.Spec 没有 omitempty
        required:
        - spec

        type: object

    # served: 此版本是否可以通过 API 访问
    served: true

    # storage: 此版本是否是存储版本
    storage: true

    # subresources: 子资源定义
    # 来源：// +kubebuilder:subresource:status
    # 作用：分离 spec 和 status 的更新权限，避免冲突
    subresources:
      status: {}
