# CustomResourceDefinition (CRD) 详细注释 - 嵌套类型 (Nested Types)
#
# 此文件展示 api/v1alpha1/helloworld_types.go 中的嵌套结构体
# 是如何被 controller-gen 转换成 CRD YAML 的。
