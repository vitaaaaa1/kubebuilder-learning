apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: scalableapps.demo.vitaaaaa.icu
spec:
  group: demo.vitaaaaa.icu
  names:
    kind: ScalableApp
    listKind: ScalableAppList
    plural: scalableapps
    singular: scalableapp
    shortNames:
      - sa
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                replicas:
                  type: integer
                  format: int32
                image:
                  type: string
                port:
                  type: integer
                  format: int32
            status:
              type: object
              properties:
                readyReplicas:
                  type: integer
                  format: int32
                selector:
                  type: string
                phase:
                  type: string
      subresources:
        status: {}
        scale:
          specReplicasPath: .spec.replicas
          statusReplicasPath: .status.readyReplicas
          labelSelectorPath: .status.selector
