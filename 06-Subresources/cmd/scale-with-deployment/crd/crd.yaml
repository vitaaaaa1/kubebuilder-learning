apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: scalableapps.demo.vitaaaaa.icu
spec:
  group: demo.vitaaaaa.icu
  names:
    kind: ScalableApp
    listKind: ScalableAppList
    plural: scalableapps
    singular: scalableapp
    shortNames:
      - sa
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                replicas:
                  type: integer
                  format: int32
                image:
                  type: string
                port:
                  type: integer
                  format: int32
            status:
              type: object
              properties:
                readyReplicas:
                  type: integer
                  format: int32
                selector:
                  type: string
                phase:
                  type: string
      subresources:
        status: {}
        scale:
          # 期望副本数路径（JSON 路径）
          # HPA 读取这个值作为"当前 replicas"，并写入新的值
          specReplicasPath: .spec.replicas

          # 实际就绪副本数路径（JSON 路径）
          # HPA 读取这个值确认缩放是否生效
          statusReplicasPath: .status.readyReplicas

          # Label Selector 路径（JSON 路径）
          # HPA 用它来找到属于这个 CRD 的 Pod（用于采集 CPU/内存指标）
          labelSelectorPath: .status.selector
