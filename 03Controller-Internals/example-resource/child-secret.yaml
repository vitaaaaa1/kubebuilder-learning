# 这是一个带有 OwnerReference 的 Secret 示例
# 用于测试 Controller 的 Owns() 机制
#
# 使用方法：
# 1. 先创建一个名为 "my-owner" 的 ConfigMap:
#    kubectl create configmap my-owner -n test
#
# 2. 获取该 ConfigMap 的 UID:
#    kubectl get configmap my-owner -n test -o jsonpath='{.metadata.uid}'
#
# 3. 将下方 uid: "REPLACE_WITH_CONFIGMAP_UID" 替换为实际 UID，然后执行:
#    kubectl apply -f child-secret.yaml

apiVersion: v1
kind: Secret
metadata:
  name: my-child-secret
  namespace: test
  # OwnerReference: 声明这个 Secret 属于某个 ConfigMap
  ownerReferences:
  - apiVersion: v1
    kind: ConfigMap
    name: my-owner
    # ⚠️ 必须替换为实际 ConfigMap 的 UID，否则 K8s 无法关联
    # uid: "REPLACE_WITH_CONFIGMAP_UID"
    uid: "663bd960-ed63-4a7a-87c4-bc26aa3a6006"
type: Opaque
data:
  # base64 编码的 "value"
  key: dmFsdWU=
