# 这个文件通常由 `make manifests` 自动生成
# 这里我们手动编写以展示其结构

apiVersion: admissionregistration.k8s.io/v1
kind: MutatingWebhookConfiguration
metadata:
  name: mutating-webhook-configuration
webhooks:
  - admissionReviewVersions:
      - v1
    clientConfig:
      service:
        name: webhook-service
        namespace: system
        path: /mutate-demo-vitaaaaa-icu-v1alpha1-demoapp
    failurePolicy: Fail
    name: mdemoapp.demo.vitaaaaa.icu
    rules:
      - apiGroups:
          - demo.vitaaaaa.icu
        apiVersions:
          - v1alpha1
        operations:
          - CREATE
          - UPDATE
        resources:
          - demoapps
    sideEffects: None
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: validating-webhook-configuration
webhooks:
  - admissionReviewVersions:
      - v1
    clientConfig:
      service:
        name: webhook-service
        namespace: system
        path: /validate-demo-vitaaaaa-icu-v1alpha1-demoapp
    failurePolicy: Fail
    name: vdemoapp.demo.vitaaaaa.icu
    rules:
      - apiGroups:
          - demo.vitaaaaa.icu
        apiVersions:
          - v1alpha1
        operations:
          - CREATE
          - UPDATE
        resources:
          - demoapps
    sideEffects: None
